[package]
name = "keel-pkg"
version = "0.1.0"
edition = "2024"
authors = ["Horace Hoff <horace.hoff@gmail.com>"]
repository = "https://github.com/horacehoff/keel"
homepage = "https://keel-lang.com"
license = "Apache-2.0"
documentation = "https://docs.keel-lang.com"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
constcat = "0.6.1"
flate2 = { version="1.1.9",features=["zlib-rs"]}
futures-util = "0.3.34"
indicatif = {version="0.18.6", features=["tokio"]}
junction = "2.0.0"
owo-colors = "4.3.0"
reqwest = {version="0.13.4", features = ["stream","json"]}
serde = {version="1.0.229", features = ["derive"]}
tar = "0.4.46"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = {version="0.7.19",features=["io","io-util"]}

[profile.dev]
opt-level = 1
debug = false
strip = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = 'abort'
debug = false
rpath = false
strip = true
debug-assertions = false
incremental = false

[profile.release.package."*"]
opt-level = 3
debug = false
codegen-units = 1
incremental = false
strip = true

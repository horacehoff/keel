[package]
name = "keel-pkg"
version = "0.1.0"
edition = "2024"
authors = ["Horace Hoff <horace.hoff@gmail.com>"]
repository = "https://github.com/horacehoff/keel"
homepage = "https://keel-lang.com"
license = "Apache-2.0"
documentation = "https://docs.keel-lang.com"
description = "The package manager for the Keel programming language."

[dependencies]
anyhow = "1.0.104"
console = "0.16"
clap = { version = "4.6.8", features = ["derive"] }
constcat = "0.6.1"
flate2 = { version = "1.1.11", features = [
    "zlib-rs",
], default-features = false }
fs-err = "3.3.2"
futures-util = "0.3.34"
hybrid-format = "0.3.0"
indicatif = { version = "0.18.6", features = ["tokio"] }
reqwest = { version = "0.13.5", features = [
    "stream",
    "json",
    "native-tls",
    "system-proxy",
], default-features = false }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
tokio-util = { version = "0.7.20", features = ["io", "io-util"] }
toml = "1.2.1"

[profile.dev]
opt-level = 1
debug = false
strip = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = 'abort'
debug = false
rpath = false
strip = true
debug-assertions = false
incremental = false

[profile.release.package."*"]
opt-level = 3
debug = false
codegen-units = 1
incremental = false
strip = true
[package]
name = "keel-pkg"
version = "0.1.0"
edition = "2024"
authors = ["Horace Hoff <horace.hoff@gmail.com>"]
repository = "https://github.com/horacehoff/keel"
homepage = "https://keel-lang.com"
license = "Apache-2.0"
documentation = "https://docs.keel-lang.com"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
futures-util = "0.3.34"
indicatif = "0.18.6"
owo-colors = "4.3.0"
reqwest = {version="0.13.4", features = ["stream"]}
serde = {version="1.0.229", features = ["derive"]}
tokio = { version = "1.53.1", features = ["full"] }

[profile.dev]
opt-level = 1
debug = false
strip = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = 'abort'
debug = false
rpath = false
strip = true
debug-assertions = false
incremental = false

[profile.release.package."*"]
opt-level = 3
debug = false
codegen-units = 1
incremental = false
strip = true
